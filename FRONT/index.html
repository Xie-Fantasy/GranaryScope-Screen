<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>谷仓视界 · GranaryScope</title>
    <script>
      (function () {
        var theme = 'blue';
        try {
          var saved = window.localStorage.getItem('liangcang-theme');
          if (saved === 'green' || saved === 'blue') theme = saved;
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* 初始加载样式 - 防止白屏 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #071321;
        overflow: hidden;
      }
      html[data-theme="green"],
      html[data-theme="green"] body { background-color: #031B1A; }
      #app {
        width: 100%;
        height: 100%;
      }
      /* 加载动画 */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #071321;
        color: #B3C0C1;
        z-index: 9999;
      }
      html[data-theme="green"] .loading-screen { background: #031B1A; }
      .loading-screen__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(53, 188, 227, 0.2);
        border-top-color: #35BCE3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      html[data-theme="green"] .loading-screen__spinner {
        border-color: rgba(53, 214, 174, 0.2);
        border-top-color: #35D6AE;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 初始加载画面 -->
      <div class="loading-screen">
        <div class="loading-screen__spinner"></div>
        <span>系统加载中...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
